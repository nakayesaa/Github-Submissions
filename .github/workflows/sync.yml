name: Sync LeetCode

on:
  push:
    branches: [main]
    paths:
      - sync.py
      - .github/workflows/sync.yml
  schedule:
    - cron: '27,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leetcode-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run checks
        run: python -m unittest -q
      - name: Import and sync Accepted solutions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python sync.py
      - name: Commit and push changes
        env:
          COMMIT_NAME: ${{ vars.COMMIT_NAME || 'hajendra herlambang' }}
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL || 'hajendraherlambang742@gmail.com' }}
        run: |
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"
          git add .leetcode-sync.json
          if [ -d solutions ]; then git add -- solutions; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync accepted LeetCode solutions"
          git push
